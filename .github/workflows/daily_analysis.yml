name: PTP Value Betting Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Ejecución diaria
  workflow_dispatch:     # Permite ejecución manual desde la app móvil

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Motor de Valor
        env:
          THE_STATS_API_KEY: ${{ secrets.THE_STATS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.core.value_finder
